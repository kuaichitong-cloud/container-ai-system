name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install Tesseract OCR
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          $candidates = @(
            "$env:ProgramFiles\Tesseract-OCR",
            "${env:ProgramFiles(x86)}\Tesseract-OCR"
          )
          $install = $candidates | Where-Object { Test-Path (Join-Path $_ "tesseract.exe") } | Select-Object -First 1
          if (-not $install) {
            $cmd = Get-Command tesseract.exe -ErrorAction SilentlyContinue
            if ($cmd) { $install = Split-Path $cmd.Source }
          }
          if (-not $install) { throw "Tesseract installation not found." }
          New-Item -ItemType Directory -Force -Path "tesseract\tessdata" | Out-Null
          Copy-Item (Join-Path $install "*") "tesseract" -Recurse -Force
          Invoke-WebRequest "https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata" -OutFile "tesseract\tessdata\eng.traineddata"
          Invoke-WebRequest "https://github.com/tesseract-ocr/tessdata_fast/raw/main/chi_sim.traineddata" -OutFile "tesseract\tessdata\chi_sim.traineddata"
          if (-not (Test-Path "tesseract\tesseract.exe")) { throw "Bundled tesseract.exe missing." }
          if (-not (Test-Path "tesseract\tessdata\chi_sim.traineddata")) { throw "Chinese OCR data missing." }
          if (-not (Test-Path "tesseract\tessdata\eng.traineddata")) { throw "English OCR data missing." }

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build single-file EXE
        run: |
          python -m PyInstaller --noconfirm --clean "集装箱资料智能生成系统.spec"
          if (!(Test-Path "dist\集装箱资料智能生成系统.exe")) { throw "EXE build failed." }

      - name: Assemble shareable folder
        shell: pwsh
        run: |
          $out = "release\集装箱资料智能生成系统_免费分享版"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "dist\集装箱资料智能生成系统.exe" $out
          Copy-Item "使用说明_先看我.txt" $out
          Copy-Item "免费分享许可.txt" $out
          Copy-Item "模板" $out -Recurse
          Compress-Archive -Path $out -DestinationPath "release\集装箱资料智能生成系统_免费完整版.zip" -Force

      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: Container-AI-Windows-Full-Package
          path: release/集装箱资料智能生成系统_免费完整版.zip
          if-no-files-found: error
          retention-days: 30
